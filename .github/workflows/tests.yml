name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The SDK targets Java 11; Gradle itself runs on 21 and runs the tests on each of these.
        java: [11, 17, 21, 25]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests on Java ${{ matrix.java }}
        run: ./gradlew test springTest -PtestJavaHome="$JAVA_HOME_${{ matrix.java }}_X64" --no-daemon

  jitpack:
    name: Build as JitPack does
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish to the local Maven repository (jar, sources, javadoc, POM)
        run: |
          ./gradlew publishToMavenLocal -x test -Pgroup=com.github.9in-io -Pversion=ci-SNAPSHOT --no-daemon
          ls -l ~/.m2/repository/com/github/9in-io/java/ci-SNAPSHOT/
